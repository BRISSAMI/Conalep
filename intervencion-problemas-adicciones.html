<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intervención en Problemas de Adicciones - Enlaces de Consulta</title>
  <style>
    :root {
      --primary-guinda: #7a1126;
      --secondary-yellow: #eab308;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-dark);
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--primary-guinda);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 25px;
      transition: transform 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-4px);
    }

    .header-section {
      text-align: center;
      margin-bottom: 35px;
    }

    .header-section h1 {
      color: var(--primary-guinda);
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .underline-accent {
      width: 70px;
      height: 4px;
      background-color: var(--secondary-yellow);
      margin: 0 auto 15px auto;
      border-radius: 2px;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .list-section {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 30px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      color: var(--primary-guinda);
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-left: 4px solid var(--secondary-yellow);
      padding-left: 10px;
    }

    .links-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links-list li {
      background: var(--bg-light);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .links-list li:hover {
      border-color: var(--primary-guinda);
      background: #fdf2f8;
    }

    .links-list a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .links-list a span.badge-num {
      background-color: var(--primary-guinda);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 9px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .links-list a:hover span.badge-num {
      background-color: var(--secondary-yellow);
      color: var(--text-dark);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Botón para regresar a la Biblioteca Virtual -->
    <a href="BibliotecaV.html" class="back-btn">&larr; Regresar a la Biblioteca Virtual</a>

    <div class="header-section">
      <h1>Guía Pedagógica del Módulo Intervención en Problemas de Adicciones</h1>
      <div class="underline-accent"></div>
      <p>Enlaces y referencias de consulta verificados.</p>
    </div>

    <div class="list-section">
      <div class="section-title">Enlaces de Referencia</div>
      <ul class="links-list">
        <li>
          <a href="http://www.cij.gob.mx/Publicaciones/material_tratamiento.html" target="_blank">
            <span class="badge-num">01</span>
            <span>Centros de Integración Juvenil | Gobierno | gob.mx (cij.gob.mx)</span>
          </a>
        </li>
      </ul>
    </div>

  </div>

</body>
</html>
